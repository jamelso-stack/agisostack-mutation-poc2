name: Mutation testing with Mull

on:
  workflow_dispatch:

jobs:
  mutation-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and Mull
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates cmake ninja-build jq python3 clang-19 llvm-19

          curl -1sLf 'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y mull-19

          clang-19 --version
          clang++-19 --version
          mull-runner-19 --version

      - name: Create Mull configuration
        run: |
          cat > mull.yml << 'EOF'
          quiet: false

          mutators:
            - cxx_add_to_sub

          includePaths:
            - ".*/utility/.*"

          excludePaths:
            - ".*/test/.*"
            - ".*/examples/.*"
            - ".*/docs/.*"
            - ".*/sphinx/.*"
          EOF

          cat mull.yml

      - name: Configure project with Mull enabled
        run: |
          PLUGIN_PATH=$(find /usr -name "mull-ir-frontend-19*" -type f | head -n 1)

          echo "Mull plugin path: $PLUGIN_PATH"

          cmake -S . -B build-mull -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_FLAGS="-g -grecord-command-line -fpass-plugin=$PLUGIN_PATH" \
            -DCMAKE_CXX_FLAGS="-g -grecord-command-line -fpass-plugin=$PLUGIN_PATH"

      - name: Build project with Mull instrumentation
        run: |
          cmake --build build-mull

      - name: Run unit tests normally before mutation testing
        run: |
          ctest --test-dir build-mull --output-on-failure

      - name: Discover CTest test executables
        run: |
          ctest --test-dir build-mull --show-only=json-v1 > ctest-tests.json
          cat ctest-tests.json

      
      - name: Run Mull on discovered test executables
        run: |
          mkdir -p mutation-results

          python3 << 'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          with open("ctest-tests.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          tests = data.get("tests", [])

          if not tests:
              print("No tests discovered by CTest.")
              raise SystemExit(1)

          print(f"Discovered {len(tests)} CTest tests.")

          def sanitize(name):
              return re.sub(r"[^A-Za-z0-9_.-]+", "_", name)

          summary_index = []

          for index, test in enumerate(tests, start=1):
              name = test.get("name", f"unknown-test-{index}")
              safe_name = sanitize(name)
              report_name = f"{index:03d}_{safe_name}"

              command = test.get("command", [])

              if not command:
                  print(f"Skipping {name}: no command found.")
                  continue

              executable = command[0]
              args = command[1:]

              properties = test.get("properties", [])
              working_directory = "build-mull"

              for prop in properties:
                  if prop.get("name") == "WORKING_DIRECTORY":
                      working_directory = prop.get("value", working_directory)

              if not os.path.isabs(executable):
                  candidate = os.path.join(working_directory, executable)
                  if os.path.exists(candidate):
                      executable = candidate

              executable = os.path.abspath(executable)

              print("")
              print("=" * 100)
              print(f"Running Mull for CTest test: {name}")
              print(f"Report name: {report_name}")
              print(f"Executable: {executable}")
              print(f"Arguments: {args}")
              print("=" * 100)

              if not os.path.exists(executable):
                  print(f"Executable not found, skipping: {executable}")
                  continue

              log_path = f"mutation-results/{report_name}.txt"

              cmd = [
                  "mull-runner-19",
                  "--allow-surviving",
                  "--mutation-score-threshold", "0",
                  "--workers", "2",
                  "--timeout", "60000",
                  "--reporters", "IDE",
                  "--reporters", "SQLite",
                  "--report-dir", "mutation-results",
                  "--report-name", report_name,
                  executable,
              ] + args

              with open(log_path, "w", encoding="utf-8") as log:
                  log.write(f"CTest test name: {name}\n")
                  log.write(f"Executable: {executable}\n")
                  log.write(f"Arguments: {args}\n")
                  log.write("=" * 100 + "\n\n")
                  log.flush()

                  result = subprocess.run(
                      cmd,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True
                  )

                  print(result.stdout)
                  log.write(result.stdout)

              summary_index.append((name, report_name, log_path))

              if result.returncode != 0:
                  print(f"Mull returned non-zero exit code for {name}: {result.returncode}")
                  print("Continuing with next test executable for POC purposes.")

          with open("mutation-results/index.txt", "w", encoding="utf-8") as index_file:
              for name, report_name, log_path in summary_index:
                  index_file.write(f"{report_name} => {name} => {log_path}\n")

          print("")
          print("Generated mutation result files:")
          for name, report_name, log_path in summary_index:
              print(f"{report_name} => {name} => {log_path}")
          PY

      - name: Generate Mull summary report
        if: always()
        run: |
          echo "Mutation result files:"
          ls -la mutation-results || true

          echo ""
          echo "Searching for surviving mutant at thread_synchronization.hpp:200..."
          grep -R "thread_synchronization.hpp:200" mutation-results/*.txt || true

          echo ""
          echo "CTest test index:"
          cat mutation-results/index.txt || true

          echo ""
          echo "Generating reporter summaries from SQLite files..."
          for db in mutation-results/*.sqlite; do
            if [ -f "$db" ]; then
              base=$(basename "$db" .sqlite)
              echo ""
              echo "============================================================"
              echo "Summary for $base"
              echo "============================================================"
              mull-reporter-19 --reporters IDE "$db" | tee "mutation-results/${base}_summary.txt" || true
            fi
          done

          echo ""
          echo "Searching again in generated summaries..."
          grep -R "thread_synchronization.hpp:200" mutation-results/*_summary.txt || true
      
      - name: Upload mutation testing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results
          path: mutation-results/
