name: Mutation Score - Plus to Minus

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

env:
  BUILD_DIR: build
  MULL_LLVM_VERSION: "19"
  MULL_REPORT_DIR: mull-report
  MULL_REPORT_NAME: agisostack-plus-to-minus
  MULL_WORKERS: "2"
  MULL_TIMEOUT_MS: "120000"

jobs:
  mutation-score-plus-to-minus:
    name: Mull mutation score cxx_add_to_sub
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies, LLVM and Mull
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ca-certificates \
            gnupg \
            lsb-release \
            software-properties-common \
            cmake \
            ninja-build \
            python3 \
            sqlite3

          # LLVM / Clang.
          # The Mull package version must match the LLVM/Clang version used to build the project.
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${MULL_LLVM_VERSION}"

          # Mull stable repository.
          curl -1sLf 'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y "mull-${MULL_LLVM_VERSION}"

          clang++-${MULL_LLVM_VERSION} --version
          mull-runner-${MULL_LLVM_VERSION} --version
          mull-reporter-${MULL_LLVM_VERSION} --version

          test -f "/usr/lib/mull-ir-frontend-${MULL_LLVM_VERSION}"

      - name: Create Mull configuration
        shell: bash
        run: |
          set -euxo pipefail

          cat > mull.yml <<'EOF'
          mutators:
            - cxx_add_to_sub

          # On veut analyser le code du projet, pas les dépendances vendored ni le dossier de build.
          # Si tu veux vraiment muter aussi les tests, supprime les lignes .*test.* et .*gtest.* ci-dessous.
          includePaths:
            - .*

          excludePaths:
            - .*/build/.*
            - .*/cmake-build-.*
            - .*/_deps/.*
            - .*/third_party/.*
            - .*/external/.*
            - .*/vendor/.*
            - .*/googletest/.*
            - .*/gtest/.*
            - .*/gmock/.*
            - .*test.*
            - .*Test.*
            - .*tests.*
            - .*Tests.*
          EOF

          cat mull.yml

      - name: Configure CMake with Mull instrumentation
        shell: bash
        run: |
          set -euxo pipefail

          export CC="clang-${MULL_LLVM_VERSION}"
          export CXX="clang++-${MULL_LLVM_VERSION}"

          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-${MULL_LLVM_VERSION}" \
            -DCMAKE_C_FLAGS="-O0 -g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-${MULL_LLVM_VERSION}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "${BUILD_DIR}" --parallel "$(nproc)"

      - name: Baseline tests
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir "${BUILD_DIR}" --output-on-failure

      - name: Discover CTest commands without printing test names
        shell: bash
        run: |
          set -euxo pipefail

          ctest --test-dir "${BUILD_DIR}" --show-only=json-v1 > ctest-tests.json

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          with open("ctest-tests.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          targets = []
          seen = set()

          for test in data.get("tests", []):
              command = test.get("command", [])
              if not command:
                  continue

              properties = {
                  p.get("name"): p.get("value")
                  for p in test.get("properties", [])
                  if "name" in p
              }

              working_directory = properties.get("WORKING_DIRECTORY")
              if not working_directory:
                  working_directory = str(Path("build").resolve())
              else:
                  working_directory = str(Path(working_directory).resolve())

              exe = command[0]
              args = command[1:]

              exe_path = Path(exe)
              if not exe_path.is_absolute():
                  candidate_from_cwd = Path(working_directory) / exe_path
                  candidate_from_build = Path("build") / exe_path

                  if candidate_from_cwd.exists():
                      exe_path = candidate_from_cwd
                  else:
                      exe_path = candidate_from_build

              exe_path = exe_path.resolve()

              if not exe_path.exists() or not os.access(exe_path, os.X_OK):
                  continue

              env_entries = []
              environment_property = properties.get("ENVIRONMENT")

              if isinstance(environment_property, list):
                  env_entries = environment_property
              elif isinstance(environment_property, str):
                  env_entries = [environment_property]

              key = (
                  str(exe_path),
                  tuple(args),
                  working_directory,
                  tuple(env_entries),
              )

              if key in seen:
                  continue

              seen.add(key)

              targets.append({
                  "executable": str(exe_path),
                  "args": args,
                  "working_directory": working_directory,
                  "environment": env_entries,
              })

          if not targets:
              raise SystemExit("No CTest executable command found. Check CTest registration / add_test configuration.")

          with open("mull-targets.json", "w", encoding="utf-8") as f:
              json.dump(targets, f, indent=2)

          print(f"Discovered {len(targets)} unique CTest command(s).")
          PY
        
      - name: Run Mull on all discovered test executables
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${MULL_REPORT_DIR}"

          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          mull_version = os.environ["MULL_LLVM_VERSION"]
          workers = os.environ["MULL_WORKERS"]
          timeout_ms = os.environ["MULL_TIMEOUT_MS"]
          report_dir = os.environ["MULL_REPORT_DIR"]
          report_name = os.environ["MULL_REPORT_NAME"]

          with open("mull-targets.json", "r", encoding="utf-8") as f:
              targets = json.load(f)

          for index, target in enumerate(targets, start=1):
              print(f"Running Mull on CTest command {index}/{len(targets)}...")

              env = os.environ.copy()
              env["MULL_CONFIG"] = "./mull.yml"

              for entry in target.get("environment", []):
                  if "=" in entry:
                      key, value = entry.split("=", 1)
                      env[key] = value

              executable = target["executable"]
              args = target.get("args", [])
              working_directory = target.get("working_directory") or os.getcwd()

              command = [
                  f"mull-runner-{mull_version}",
                  "--workers", workers,
                  "--timeout", timeout_ms,
                  "--minimum-timeout", timeout_ms,
                  "--include-not-covered",
                  "--allow-surviving",
                  "--mutation-score-threshold", "0",
                  "--no-output",
                  "--reporters", "SQLite",
                  "--report-dir", report_dir,
                  "--report-name", report_name,
                  executable,
              ]

              # Important:
              # CTest arguments may start with --, for example --gtest_filter.
              # The separator -- tells Mull that following values are runner args.
              if args:
                  command.append("--")
                  command.extend(args)

              result = subprocess.run(
                  command,
                  cwd=working_directory,
                  env=env,
                  text=True,
              )

              if result.returncode != 0:
                  print(f"Mull failed on CTest command {index}/{len(targets)}.")
                  sys.exit(result.returncode)

          print("Mull completed on all discovered CTest commands.")
          PY

      - name: Generate final mutation score only
        shell: bash
        run: |
          set -euxo pipefail

          SQLITE_REPORT="${MULL_REPORT_DIR}/${MULL_REPORT_NAME}.sqlite"

          test -f "${SQLITE_REPORT}"

          # Generate the full Mull report internally, but do not print surviving mutants in the GitHub log.
          mull-reporter-${MULL_LLVM_VERSION} \
            --allow-surviving \
            --mutation-score-threshold 0 \
            --reporters IDE \
            "${SQLITE_REPORT}" \
            > "${MULL_REPORT_DIR}/final-mull-report.txt"

          {
            echo "## Mutation testing result"
            echo ""
            echo "- Mutator: \`cxx_add_to_sub\`"
            echo "- Mutation: \`+\` vers \`-\`"
            echo "- Scope: project sources configured in \`mull.yml\`"
            echo ""
            grep -E "Mutation score|Surviving mutants|Total reporting time|Total execution time" "${MULL_REPORT_DIR}/final-mull-report.txt" || true
          } | tee "${MULL_REPORT_DIR}/mutation-score-summary.md"

          cat "${MULL_REPORT_DIR}/mutation-score-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation score artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mull-plus-to-minus-mutation-score
          path: |
            mull.yml
            mull-report/agisostack-plus-to-minus.sqlite
            mull-report/mutation-score-summary.md
          if-no-files-found: error
